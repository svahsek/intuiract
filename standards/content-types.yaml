version: "0.1.0"
last_updated: "2026-11-03"
description: >-
  Central registry of content types that can be consumed from this
  repository by local agents, reusable skills, or external repositories.

content_types:
  release-notes:
    name: "Release Notes"
    status: "active"
    visibility: "public"
    description: >-
      Schema-driven release notes system with deterministic validation rules,
      rendering rules, agent guidance, and example payloads.
    manifest: "standards/content-types/release-notes.yaml"
    templates_root: "templates/release-notes"
    skill: "skills/release-notes/SKILL.md"
    consumer_skill: "skills/release-notes/consumer-release-notes.skill.md"
    classification_rules: "standards/classification-rules.yaml"
    source_files:
      schema: "templates/release-notes/release-notes-schema.yaml"
      rendering: "templates/release-notes/release-notes-rendering.yaml"
      quick_reference: "templates/release-notes/release-notes-quick-reference.md"
      overview: "templates/release-notes/readme.md"
      examples:
        - "templates/release-notes/examples/minimal-release-notes.yaml"
        - "templates/release-notes/examples/comprehensive-release-notes.yaml"
        - "templates/release-notes/examples/classification-overrides.yaml"
    intended_consumers:
      - "Workspace-local agent skills"
      - "Other repositories using raw GitHub file URLs"
      - "Validation and rendering pipelines"
    temporary_remote_usage:
      recommendation: >-
        Until version tags are introduced, consumer repositories should fetch
        the manifest and source files from a pinned branch or commit SHA to
        reduce drift.

  overview:
    name: "Overview"
    status: "active"
    visibility: "public"
    description: >-
      Schema-driven product/component overview pages maintained by a single incremental
      pipeline: a one-time bootstrap ingestion (existing overview page + features page)
      followed by ongoing patches driven by the release-notes pipeline's own output, so
      the feature-coverage table and upcoming-features list stay current with what actually
      shipped without a human rewriting the whole page every release.
    manifest: "standards/content-types/overview.yaml"
    templates_root: "templates/overview"
    skill: "skills/overview/SKILL.md"
    consumer_skill: "skills/overview/consumer-overview.skill.md"
    source_files:
      schema: "templates/overview/overview-schema.yaml"
      rendering: "templates/overview/overview-rendering.yaml"
      quick_reference: "templates/overview/overview-quick-reference.md"
      overview: "templates/overview/readme.md"
      examples:
        - "templates/overview/examples/minimal-overview.yaml"
        - "templates/overview/examples/comprehensive-overview.yaml"
        - "templates/overview/examples/overview-evidence.sample.yaml"
    intended_consumers:
      - "Workspace-local agent skills"
      - "Other repositories using raw GitHub file URLs"
      - "Validation and rendering pipelines"
      - "The release-notes pipeline's consumer skill, as an upstream evidence producer"
    temporary_remote_usage:
      recommendation: >-
        Until version tags are introduced, consumer repositories should fetch
        the manifest and source files from a pinned branch or commit SHA to
        reduce drift.

  features:
    name: "Features"
    status: "active"
    visibility: "public"
    description: >-
      An incremental, product-level feature catalog bootstrapped from an existing
      page and updated from high-confidence shipped release evidence.
    manifest: "standards/content-types/features.yaml"
    templates_root: "templates/features"
    skill: "skills/features/SKILL.md"
    review_and_remediate_skill: "skills/features/review-and-remediate.skill.md"
    consumer_skill: "skills/features/consumer-features.skill.md"
    source_files:
      schema: "templates/features/features-schema.yaml"
      rendering: "templates/features/features-rendering.yaml"
      quick_reference: "templates/features/features-quick-reference.md"
      overview: "templates/features/readme.md"
      writing_guidelines: "templates/features/features-page.guidelines.md"
      examples:
        - "templates/features/examples/minimal-features.yaml"
        - "templates/features/examples/comprehensive-features.yaml"
    intended_consumers:
      - "Workspace-local agent skills"
      - "Other repositories using raw GitHub file URLs"
      - "Validation and rendering pipelines"
      - "Release-evidence producers"

  user-guide:
    name: "User Guide"
    status: "draft"
    visibility: "public"
    description: >-
      Markdown-first standards and remediation workflow for improving existing
      user-guide pages without changing unverified product facts.
    manifest: "standards/content-types/user-guide.yaml"
    templates_root: "templates/user-guide"
    skill: "skills/user-guide/SKILL.md"
    review_and_remediate_skill: "skills/user-guide/review-and-remediate.skill.md"
    source_files:
      content_model: "templates/user-guide/user-guide-content-model.yaml"
      rendering: "templates/user-guide/user-guide-rendering.yaml"
      quick_reference: "templates/user-guide/user-guide-quick-reference.md"
      overview: "templates/user-guide/readme.md"
      writing_guidelines: "templates/user-guide/user-guide-writing-guidelines.md"
      audit_report_schema: "templates/user-guide/audit-report-schema.yaml"
      examples:
        - "templates/user-guide/examples/minimal-user-guide.md"
        - "templates/user-guide/examples/comprehensive-user-guide.md"
      fixtures: "templates/user-guide/examples/fixtures/"
    intended_consumers:
      - "Existing Markdown user-guide pages"
      - "Consumer-repository review skills"
      - "Documentation quality workflows"
