id: "release-notes"
name: "Release Notes"
status: "active"
last_updated: "2026-07-10"
description: >-
  Public manifest for the release-notes content type. Consumer repositories can
  fetch this file first, then resolve the schema, rendering rules, examples,
  and agent guidance from the referenced paths.

ownership:
  maintained_by: "Documentation Team"
  repository_scope: "intuiract standards repository"

entrypoints:
  schema: "templates/release-notes/release-notes-schema.yaml"
  rendering: "templates/release-notes/release-notes-rendering.yaml"
  quick_reference: "templates/release-notes/release-notes-quick-reference.md"
  overview: "templates/release-notes/readme.md"
  skill: "skills/release-notes/SKILL.md"
  consumer_skill: "skills/release-notes/consumer-release-notes.skill.md"
  human_rules: "rules/release-notes/release-notes-rule.yaml"
  classification_rules: "standards/classification-rules.yaml"
  source_precedence: "standards/source-precedence.yaml"
  release_evidence_fields: "standards/release-evidence-fields.yaml"
  confidence_rule: "rules/release-evidence-confidence-rule.yaml"
  mapping: "templates/release-notes/evidence-to-release-notes-mapping.yaml"
  release_evidence_contract: "docs/course-correction/release-evidence-contract-v1.md"

examples:
  minimal: "templates/release-notes/examples/minimal-release-notes.yaml"
  comprehensive: "templates/release-notes/examples/comprehensive-release-notes.yaml"
  classification_overrides: "templates/release-notes/examples/classification-overrides.yaml"
  evidence_sample: "templates/release-notes/examples/release-evidence.sample.yaml"

consumer_usage:
  workflow:
    - "Fetch this manifest file from the central repository."
    - "Resolve the schema and rendering files from the entrypoints section."
    - "Generate or collect release data in YAML that matches the schema."
    - "Validate the YAML before rendering Markdown output."
    - "Optionally use the skill file as the orchestration contract for an agent."
  remote_reference_strategy:
    recommended_now: "Use direct raw URLs to these files from main or a pinned commit SHA."
    recommended_later: "Pin to a release tag such as v1 once multiple content types stabilize."
  notes:
    - "The schema is the source of truth for required fields and validation rules."
    - "The rendering file defines deterministic YAML-to-Markdown behavior."
    - "The quick reference is optimized for agent prompting and lightweight generation."
    - "The consumer_skill is a full orchestration template for consumer repos — copy and adapt."
    - "classification_rules defines the central baseline for commit-to-category mapping."
    - "consumer_skill has no separate input file: per-repo and per-release configuration is edited directly in its Step 0a Release Configuration block after copying. In CI, per-release values can be overridden via env vars instead of editing the file."
    - "Copy classification_overrides example to standards/ in the consumer repo and customize."
    - "source_precedence, release_evidence_fields, confidence_rule, and mapping are all required by the reconciliation step (Step 4 of consumer_skill) — resolve them from this manifest the same way as schema/rendering/human_rules, do not hardcode their paths."
    - "skill (skills/release-notes/SKILL.md) documents the full 4-layer pipeline this manifest and consumer_skill implement — read it for the conceptual model, not for file paths, since every path it references is also an entrypoint above."
